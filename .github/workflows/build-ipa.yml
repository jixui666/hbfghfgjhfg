name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Lint plists
        run: |
          plutil -lint ThreeOneOSFive/Info.plist
          plutil -lint ThreeOneOSFive/ThreeOneOSFive.entitlements
          xmllint --noout ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/3105.xcscheme

      # ---------------------------------------------------------------- 加固: 机密
      - name: Python crypto deps
        run: |
          # runner 上的 python3 是 externally-managed，--user 装会被 PEP 668 拦，
          # 所以建一个 venv 并把它的 bin 前置到 PATH，后续 python3 都走这里。
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet cryptography
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Restore integrity signing key
        env:
          INTEGRITY_PRIVATE_KEY_PEM: ${{ secrets.INTEGRITY_ED25519_KEY_PEM }}
        run: |
          python3 tools/keygen.py
          echo "pubkey: $(cat tools/integrity_pubkey.hex)"

      - name: Generate encrypted secrets
        env:
          # 真配置放 secret：{"version":1,"entries":[...],"index":{...}}
          # 没配就退回 tools/secrets.sample.json（能编译，但连不上服务器）
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          python3 tools/gen_secrets.py
          python3 tools/verify_secrets.py

      - name: Normalize bundled binary permissions
        run: |
          chmod +x ThreeOneOSFive/Frameworks/apptrace.framework/apptrace || true
          chmod +x ThreeOneOSFive/Frameworks/libapptracecore.framework/libapptracecore || true
          ls -l ThreeOneOSFive/Frameworks/apptrace.framework/apptrace
          ls -l ThreeOneOSFive/Frameworks/libapptracecore.framework/libapptracecore

      - name: List project
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Verify build output
        run: |
          APP="build/Build/Products/Release-iphoneos/TRX.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: $APP not found" >&2
            find build/Build/Products -maxdepth 3 -name '*.app' -print >&2 || true
            tail -n 200 build.log >&2 || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          ls -lh "$APP"
          # 确认预留的 __integrity 段真的被链接进去了
          otool -l "$APP/TRX" | grep -A3 '__integrity' || {
            echo "ERROR: __DATA,__integrity section missing — check OTHER_LDFLAGS" >&2
            exit 1
          }

      # ---------------------------------------------------------------- 加固: 完整性
      - name: Sign & embed integrity manifest
        run: |
          APP="build/Build/Products/Release-iphoneos/TRX.app"
          python3 tools/integrity_pack.py --app "$APP"

      - name: Verify embedded manifest
        run: |
          APP="build/Build/Products/Release-iphoneos/TRX.app"
          python3 tools/integrity_pack.py --app "$APP" --verify

      - name: Resign compatibility test
        run: |
          # 回归：模拟 codesign 往 load commands 插 LC_CODE_SIGNATURE，
          # 完整性校验必须仍然通过；改 __text 必须被抓到。
          APP="build/Build/Products/Release-iphoneos/TRX.app"
          python3 tools/selftest_resign.py --app "$APP" --profile strict
          # selftest 会改动 app，重新打一份干净的清单再继续
          python3 tools/integrity_pack.py --app "$APP" --profile strict
          python3 tools/integrity_pack.py --app "$APP" --profile strict --verify

      - name: Self-test packer logic
        run: python3 tools/selftest_integrity.py

      - name: Package IPA (unsigned)
        run: |
          APP="build/Build/Products/Release-iphoneos/TRX.app"
          rm -rf Payload TRX-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          chmod +x Payload/TRX.app/Frameworks/apptrace.framework/apptrace || true
          chmod +x Payload/TRX.app/Frameworks/libapptracecore.framework/libapptracecore || true
          zip -qry TRX-unsigned.ipa Payload
          rm -rf Payload
          ls -lh TRX-unsigned.ipa
          unzip -l TRX-unsigned.ipa | head -n 20

      - name: Collect signing material
        run: |
          cp ThreeOneOSFive/ThreeOneOSFive.entitlements TRX.entitlements
          cat TRX.entitlements

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TRX-unsigned-ipa
          path: |
            TRX-unsigned.ipa
            TRX.entitlements
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
