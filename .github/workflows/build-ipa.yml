name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List schemes (debug)
        run: xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build .app (unsigned)
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (unsigned)
        run: |
          APP="build/Build/Products/Release-iphoneos/TRX.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: $APP not found" >&2
            echo "--- build products ---" >&2
            ls -R build/Build/Products/Release-iphoneos || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TRX-unsigned.ipa Payload
          rm -rf Payload
          ls -lh TRX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TRX-unsigned-ipa
          path: TRX-unsigned.ipa
          if-no-files-found: error
